name: AdVise WIP CI

on:
  push:
    branches:
      - main
      - wip/codex-product-redesign-2026-10-05
  pull_request:
    branches:
      - main
      - ci/advise-validation-2026-10-05
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advise-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  flutter:
    name: Flutter analyze test Android Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node tool/check_pwa_worker.cjs
      - run: flutter build web --release --dart-define=ADVISE_API_URL=https://advisedigital.poyrazteknikservis.com.tr
      - run: flutter build apk --release --dart-define=ADVISE_API_URL=https://advisedigital.poyrazteknikservis.com.tr
      - uses: actions/upload-artifact@v4
        with:
          name: advise-web-pwa
          path: mobile/build/web
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: advise-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=ADVISE_API_URL=https://advisedigital.poyrazteknikservis.com.tr
      - shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\advise-windows-release.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: advise-windows
          path: mobile/build/advise-windows-release.zip
          if-no-files-found: error
