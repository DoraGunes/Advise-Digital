name: AdVise Android Test APK

on:
  push:
    branches:
      - feat/consented-ad-optimization
    paths:
      - "mobile/**"
      - ".github/workflows/android-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test --no-pub

      - name: Build internal Android test APK
        working-directory: mobile
        run: flutter build apk --release --no-pub

      - name: Verify artifact and checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          sha256sum "$apk" | tee apk.sha256
          echo "### AdVise Android internal TEST build" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          cat apk.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo "Note: current Android release config uses DEBUG signing; internal testing ONLY, not a Play Store release." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK for phone download
        uses: actions/upload-artifact@v4
        with:
          name: AdVise-Android-TEST-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
