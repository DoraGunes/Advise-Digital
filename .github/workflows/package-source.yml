name: AdVise AI Source Package
on:
  push:
    branches:
      - main
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          mkdir -p /tmp/pkg/mobile/lib /tmp/pkg/backend/src
          cp mobile/lib/*.dart /tmp/pkg/mobile/lib/
          cp mobile/pubspec.yaml /tmp/pkg/mobile/
          cp backend/src/*.js /tmp/pkg/backend/src/
          cp backend/package.json /tmp/pkg/backend/
          if [ -f backend/package-lock.json ]; then cp backend/package-lock.json /tmp/pkg/backend/; fi
          printf '%s
' 'AdVise AI direct-overwrite source package' > /tmp/pkg/README.txt
          cd /tmp/pkg
          zip -qr /tmp/AdViseAI_CHANGED_FILES_DIRECT_OVERWRITE.zip mobile backend README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: advise-ai-direct-overwrite
          path: /tmp/AdViseAI_CHANGED_FILES_DIRECT_OVERWRITE.zip
