name: AdVise Production Transition Safety
on:
  push:
    branches: [ops/advise-production-transition-2026-10-13]
permissions:
  contents: read
concurrency:
  group: advise-production-transition-safety
  cancel-in-progress: true
jobs:
  transition:
    name: Windows PowerShell 5 deploy and rollback fixture checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify limited transition safety
        shell: powershell
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tools/test/AdVise-Safe-Production-Transition.Tests.ps1') -TransitionScript (Join-Path $env:GITHUB_WORKSPACE 'tools/AdVise-Safe-Production-Transition.ps1')
