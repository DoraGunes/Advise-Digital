name: AdVise Final Validation

on:
  push:
    branches:
      - wip/advise-final-completion-2026-10-07

permissions:
  contents: read

jobs:
  repository_safety:
    name: Repository safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git diff check
        run: git diff --check 8d09bb2db0749f1177747635aae6f7418c4632b1...HEAD
      - name: Clean checkout verification
        shell: bash
        run: |
          set -e
          test -z "$(git status --porcelain)"
          test -z "$(git diff --cached --name-only)"
      - name: Runtime and secret diff verification
        shell: bash
        run: |
          set -e
          git diff --name-only 8d09bb2db0749f1177747635aae6f7418c4632b1...HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          if grep -E '^(backend/data/|backend/uploads/|\.env($|\.)|secrets?/|tokens?/)' /tmp/changed-files.txt; then
            echo "Unsafe runtime or secret path detected."
            exit 1
          fi

  backend_full:
    name: Full backend test suite
    needs: repository_safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Full backend tests
        run: npm test

  flutter_full:
    name: Full Flutter test suite and analyze
    needs: backend_full
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Full Flutter tests
        run: flutter test
      - name: Flutter analyze
        run: flutter analyze

  android_web:
    name: Android release and Web PWA build
    needs: flutter_full
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: PWA worker validation
        run: node tool/check_pwa_worker.cjs
      - name: Android release APK
        run: flutter build apk --release --dart-define=ADVISE_API_URL=https://advisedigital.poyrazteknikservis.com.tr
      - name: Web PWA release
        run: flutter build web --release --dart-define=ADVISE_API_URL=https://advisedigital.poyrazteknikservis.com.tr
      - name: Copy final APK
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk build/AdVise-Digital-android-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: advise-final-android
          path: mobile/build/AdVise-Digital-android-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: advise-final-web-pwa
          path: mobile/build/web
          if-no-files-found: error

  windows:
    name: Windows release build
    needs: flutter_full
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Windows release
        run: flutter build windows --release --dart-define=ADVISE_API_URL=https://advisedigital.poyrazteknikservis.com.tr
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\AdVise-Digital-windows-release.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: advise-final-windows
          path: mobile/build/AdVise-Digital-windows-release.zip
          if-no-files-found: error
