name: AdVise Ads Queue Independent Audit

on:
  push:
    branches:
      - fix/ads-queue-independent-audit-2026-10-12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advise-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git diff --check
        run: git diff --check a7ff49086c630ef3c01d74c92db905d4a28c2399...HEAD
      - name: clean checkout and staged files
        shell: bash
        run: |
          set -e
          test -z "$(git status --porcelain)"
          test -z "$(git diff --cached --name-only)"
      - name: runtime and secrets excluded
        shell: bash
        run: |
          set -e
          git diff --name-only a7ff49086c630ef3c01d74c92db905d4a28c2399...HEAD > changed-files.txt
          cat changed-files.txt
          if grep -E '^(backend/data/|backend/uploads/|\.env($|\.)|secrets?/|tokens?/)' changed-files.txt; then
            echo "Unsafe runtime or secret path detected."
            exit 1
          fi

  backend-phase:
    name: Full backend test suite
    needs: repository-safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Full backend tests
        run: npm test

  flutter-phase:
    name: Full Flutter test suite and analyze
    needs: backend-phase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Full Flutter tests
        run: flutter test
      - name: Flutter analyze
        run: flutter analyze

  android-web:
    name: Android release and Web PWA build
    needs: flutter-phase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: PWA worker validation
        run: node tool/check_pwa_worker.cjs
      - name: Android release APK
        run: flutter build apk --release --dart-define=ADVISE_API_URL=https://advisedigital.poyrazteknikservis.com.tr
      - name: Web PWA release
        run: flutter build web --release --dart-define=ADVISE_API_URL=https://advisedigital.poyrazteknikservis.com.tr
      - name: Final APK filename
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk build/AdVise-Digital-android-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: advise-final-android
          path: mobile/build/AdVise-Digital-android-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: advise-final-web-pwa
          path: mobile/build/web
          if-no-files-found: error

  windows:
    name: Windows release build
    needs: flutter-phase
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Parse read-only PowerShell diagnostic without executing it
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'tools/AdVise-Safe-Production-Diagnostic.ps1'), [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Verify diagnostic redaction and read-only behavior with synthetic data
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'advise-diagnostic-fixture'
          $fixtureData = Join-Path $fixtureRoot 'diagnostic-data'
          New-Item -ItemType Directory -Force $fixtureData, (Join-Path $fixtureRoot 'src') | Out-Null
          Set-Content (Join-Path $fixtureRoot '.env') 'ADVISE_DATA_DIR="diagnostic-data" # fixture setting'
          Add-Content (Join-Path $fixtureRoot '.env') 'META_ACCESS_TOKEN=DO_NOT_PRINT_THIS_VALUE'
          Set-Content (Join-Path $fixtureRoot 'src/server.js') "const credentials=tenantId === 'system' ? {systemAccount:true} : tenant.meta;"
          Set-Content (Join-Path $fixtureRoot 'src/automation-safety.js') "return tenantId==='system' ? {systemAccount:true} : {};"
          @(@{tenantId='system';status='FAILED';updatedAt='2026-10-12';failure=@{code='META_REJECTED';stage='creative'};providerFailure=@{code=100;subcode=33;status=400}}) | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $fixtureData 'ad_operations.json')
          @(@{tenantId='system';mediaType='REELS';publishStatus='ERROR';publishPhase='PREPARED';caption='DO_NOT_PRINT_THIS_VALUE';publicUrl='https://fixture.invalid/?access_token=DO_NOT_PRINT_THIS_VALUE';publishError='Instagram API 400: DO_NOT_PRINT_THIS_VALUE (kod 100, alt kod 2207009)'}) | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $fixtureData 'posts.json')
          @(@{type='INSTAGRAM_POST_ERROR';error='Instagram API 400: DO_NOT_PRINT_THIS_VALUE (kod 100, alt kod 2207009)'}) | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $fixtureData 'logs.json')
          @(@{id='system';meta=@{connected=$true;source='OAUTH';instagramApi='FACEBOOK';accessToken='DO_NOT_PRINT_THIS_VALUE';instagramAccessToken='DO_NOT_PRINT_THIS_VALUE'}}) | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $fixtureData 'tenants.json')
          @{system=@{geminiAdsDailyCap=300;maxDailyBudget=150}} | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $fixtureData 'settings.json')
          $before = @(Get-ChildItem $fixtureRoot -File -Recurse | Sort-Object FullName | ForEach-Object { $_.FullName + ':' + (Get-FileHash $_.FullName).Hash })
          $diagnosis = & (Join-Path $env:GITHUB_WORKSPACE 'tools/AdVise-Safe-Production-Diagnostic.ps1') -BackendPath $fixtureRoot
          $diagnosisText = $diagnosis -join "`n"
          if ($diagnosisText -match 'DO_NOT_PRINT_THIS_VALUE|fixture.invalid') { throw 'Diagnostic leaked a synthetic sensitive value.' }
          foreach ($expected in @('HELPER_SYSTEM_ENV_BYPASS=True','igCode=100','igSubcode=2207009','SYSTEM_BUDGET_CAP=300','READ_ONLY_DONE')) {
            if (-not $diagnosisText.Contains($expected)) { throw ('Missing safe diagnostic field: '+$expected) }
          }
          $after = @(Get-ChildItem $fixtureRoot -File -Recurse | Sort-Object FullName | ForEach-Object { $_.FullName + ':' + (Get-FileHash $_.FullName).Hash })
          if (Compare-Object $before $after) { throw 'Diagnostic changed fixture files.' }
          Write-Host 'Diagnostic redaction and unchanged-file checks passed.'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Windows release
        run: flutter build windows --release --dart-define=ADVISE_API_URL=https://advisedigital.poyrazteknikservis.com.tr
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\AdVise-Digital-windows-release.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: advise-final-windows
          path: mobile/build/AdVise-Digital-windows-release.zip
          if-no-files-found: error
