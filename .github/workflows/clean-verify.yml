name: AdVise AI Clean Verify

on:
  push:
    branches: [clean-final-20260930, clean-build-proof-20260930]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get
      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze
      - name: Flutter build APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=ADVISE_API_URL=https://childhood-stored-maintenance-cell.trycloudflare.com
