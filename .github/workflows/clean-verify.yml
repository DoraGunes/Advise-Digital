name: AdVise AI Clean Verify

on:
  push:
    branches: [main, clean-final-20260930]
  workflow_dispatch:

jobs:

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package updated source
        run: |
          mkdir -p /tmp/advise-final/mobile /tmp/advise-final/backend
          rsync -a --exclude='build' --exclude='.dart_tool' mobile/lib/ /tmp/advise-final/mobile/lib/
          rsync -a mobile/pubspec.yaml /tmp/advise-final/mobile/
          rsync -a backend/src/ /tmp/advise-final/backend/src/
          rsync -a backend/package.json /tmp/advise-final/backend/
          printf '%s
' 'AdVise AI FINAL source package' > /tmp/advise-final/README.txt
          printf '%s
' 'Generated from main by GitHub Actions. No secrets are included.' >> /tmp/advise-final/README.txt
          cd /tmp/advise-final
          zip -qr advise-ai-final-source.zip mobile backend README.txt
      - name: Upload final source
        uses: actions/upload-artifact@v4
        with:
          name: advise-ai-final-source
          path: /tmp/advise-final/advise-ai-final-source.zip

  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node syntax check
        run: |
          node --check backend/src/config.js
          node --check backend/src/db.js
          node --check backend/src/meta.js
          node --check backend/src/rules.js
          node --check backend/src/store.js
          node --check backend/src/optimizer.js
          node --check backend/src/scheduler.js
          node --check backend/src/server.js

  flutter-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get
      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze
      - name: Flutter build APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=ADVISE_API_URL=https://childhood-stored-maintenance-cell.trycloudflare.com
      - name: Package clean mobile
        run: |
          mkdir -p /tmp/advise-clean
          rsync -a --exclude='build' --exclude='.dart_tool' mobile/ /tmp/advise-clean/mobile/
          cd /tmp/advise-clean
          zip -qr advise-ai-clean-mobile.zip mobile
      - name: Upload clean mobile
        uses: actions/upload-artifact@v4
        with:
          name: advise-ai-clean-mobile
          path: /tmp/advise-clean/advise-ai-clean-mobile.zip
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: advise-ai-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
