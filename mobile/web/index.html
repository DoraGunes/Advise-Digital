<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111B33">
  <meta name="description" content="AdVise Digital: içerik, reklam ve öğrenmeyi tek bir AI çalışma alanında yönetin.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AdVise Digital">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AdVise Digital</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #f5f6fa; }
    #advise-loading { min-height: 100vh; display: grid; place-content: center;
      gap: 16px; text-align: center; font: 16px system-ui, sans-serif; color: #111b33; }
    #advise-loading img { margin: auto; border-radius: 20px; width: 72px; height: 72px; }
    #advise-loading small { color: #657087; }
  </style>
</head>
<body>
  <div id="advise-loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="AdVise Digital">
    <strong>AdVise Digital</strong>
    <small>Çalışma alanınız hazırlanıyor…</small>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // The worker caches only public app files. Authenticated API responses and
    // uploaded media always go directly to the server.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('advise_service_worker.js')
          .catch(() => {});
      });
    }
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('advise-loading')?.remove();
    });
  </script>
</body>
</html>
